<!DOCTYPE html>
<html>
<head>
    <title>Crop Prediction</title>
</head>
<body>

<h2>Agriculture Crop Prediction System</h2>

<form action="/predict" method="post">

    Nitrogen:
    <input type="text" name="N"><br><br>

    Phosphorus:
    <input type="text" name="P"><br><br>

    Potassium:
    <input type="text" name="K"><br><br>

    Temperature:
    <input type="text" name="temperature"><br><br>

    Humidity:
    <input type="text" name="humidity"><br><br>

    <button type="submit">Predict Crop</button>

</form>

<h3>{{ prediction_text }}</h3>

</body>
</html>
